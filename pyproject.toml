[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tangramspi"
version = "0.0.1"
requires-python = ">= 3.12"
dependencies = [
    "websockets==17.1",
    "gpiozero==2.0.1",
    "rpi.gpio==0.7.1",
    "python-dotenv"
]
authors = [
  {name = "Jim Ma", email = "jim.majk350@gmail.com"}
]
maintainers = [
  {name = "Jim Ma", email = "jim.majk350@gmail.com"}
]
description = ""
readme = "README.md"

license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[tool.setuptools.packages.find]
where = ["src"]